domain:
  type: FrequencyDomain
  f_min: 10.0
  f_max: 1024.0
  delta_f: 0.015625
waveform_generator:
  approximant: IMRPhenomXPHM
  f_ref: 20.0
intrinsic_prior:
  mass_1: bilby.core.prior.Uniform(minimum=5.0, maximum=40.0, name='mass_1')
  mass_2: bilby.core.prior.Uniform(minimum=4.0, maximum=30.0, name='mass_2')
  a_1: bilby.core.prior.Uniform(minimum=0.0, maximum=0.99, name='a_1')
  a_2: bilby.core.prior.Uniform(minimum=0.0, maximum=0.99, name='a_2')
  tilt_1: bilby.core.prior.Sine(name='tilt_1')
  tilt_2: bilby.core.prior.Sine(name='tilt_2')
  phi_12: bilby.core.prior.Uniform(minimum=0.0, maximum=6.283185307179586, name='phi_12')
  phi_jl: bilby.core.prior.Uniform(minimum=0.0, maximum=6.283185307179586, name='phi_jl')
  luminosity_distance: 1000.0
  dec: 0.0
  ra: 0.0
  theta_jn: 0.0
  psi: 0.0
  phase: 0.0
  geocent_time: 25.0
extrinsic_prior:
  luminosity_distance: 1000.0
  dec: 0.0
  ra: 0.0
  theta_jn: 0.0
  psi: 0.0
  phase: 0.0
  geocent_time: 25.0
num_samples: 100
