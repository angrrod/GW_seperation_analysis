[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-copula-vi-v2"
version = "0.1.0"
description = "Vector copula variational inference utilities"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["vector_copula_vi*"]